<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 235" width="660" height="235" role="img" aria-labelledby="title desc"><title id="title">iFi ZEN DAC 3 front headphone outputs</title><desc id="desc">Front panel diagram. To the right of the volume knob are two headphone jacks. The larger 6.35 mm jack is on the left. The smaller, far-right gold-rimmed jack is the 4.4 mm balanced headphone output. The rear balanced jack is a line output for other audio equipment.</desc><defs><linearGradient id="face" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#444747"/><stop offset="50%" stop-color="#383b3c"/><stop offset="100%" stop-color="#282c2c"/></linearGradient><linearGradient id="case" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#706b61"/><stop offset="16%" stop-color="#333539"/><stop offset="65%" stop-color="#292a2a"/><stop offset="100%" stop-color="#575755"/></linearGradient><linearGradient id="brass" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c7ac69"/><stop offset="20%" stop-color="#b19764"/><stop offset="54%" stop-color="#d4c8a5"/><stop offset="68%" stop-color="#a79776"/><stop offset="100%" stop-color="#66563e"/></linearGradient><linearGradient id="switch" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#9a9b90"/><stop offset="30%" stop-color="#5b625e"/><stop offset="100%" stop-color="#282b2a"/></linearGradient><pattern id="diamond" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 5L5 0h1L0 6z" fill="#514632"/><path d="M0 1l5 5" stroke="#f2dfad" stroke-width="1.1"/></pattern><pattern id="frontMesh" width="6" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#1c1e1c"/><circle cx="4" cy="3.5" r=".7" fill="#1c1e1c"/></pattern></defs><rect x="0" y="0" width="660" height="235" rx="0" fill="#eae4d7" /><text x="32" y="29" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" fill="#31362f" text-anchor="start" >iFi ZEN DAC 3</text><text x="627" y="29" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#51564f" text-anchor="end" letter-spacing="2">FRONT PANEL</text><path d="M69 59Q333 43 590 59Q610 60 616 82L625 126Q629 148 610 154Q369 177 69 156Q38 154 39 135L46 83Q49 62 69 59Z" fill="url(#case)" stroke="#323530" stroke-width="2"/><path d="M72 64Q333 48 585 63Q603 65 607 83L615 126Q619 142 602 146Q346 168 71 150Q47 149 48 134L55 84Q57 67 72 64Z" fill="url(#face)" stroke="#c3bba9" stroke-width="1.3"/><path d="M72 64Q181 55 278 55Q253 81 253 106Q253 134 272 157Q152 156 71 150Q47 149 48 134L55 84Q57 67 72 64Z" fill="url(#frontMesh)"/><rect x="72" y="87" width="29" height="29" rx="2" fill="#bc9d60" stroke="#69655a"/><ellipse cx="141" cy="88" rx="3" ry="3" fill="#9c9b8b" /><rect x="128" y="98" width="26" height="20" rx="7" fill="url(#switch)" stroke="#242826" stroke-width="1.6"/><ellipse cx="210" cy="88" rx="3" ry="3" fill="#9c9b8b" /><rect x="197" y="98" width="26" height="20" rx="7" fill="url(#switch)" stroke="#242826" stroke-width="1.6"/><ellipse cx="327" cy="105" rx="44" ry="44" fill="#262928" /><ellipse cx="327" cy="105" rx="40" ry="40" fill="#92866e" /><ellipse cx="327" cy="105" rx="36.5" ry="36.5" fill="url(#brass)" /><ellipse cx="327" cy="105" rx="33.5" ry="33.5" fill="url(#diamond)" stroke="#534e40" stroke-width="1.4"/><ellipse cx="463" cy="108" rx="20" ry="20" fill="#aaa68c" /><ellipse cx="463" cy="108" rx="16" ry="16" fill="#535957" /><ellipse cx="463" cy="108" rx="12.5" ry="12.5" fill="#181d1c" /><ellipse cx="463" cy="108" rx="8.5" ry="8.5" fill="#0c1212" /><ellipse cx="552" cy="108" rx="12" ry="12" fill="#b5985b" /><ellipse cx="552" cy="108" rx="8.6" ry="8.6" fill="#191d1a" /><ellipse cx="552" cy="108" rx="5.7" ry="5.7" fill="#070e0e" /><ellipse cx="552" cy="108" rx="22" ry="22" fill="none" stroke="#eed19b" stroke-width="3" stroke-dasharray="3 3"/><path d="M463 133v31l-25 26h-61" fill="none" stroke="#5c6860" stroke-width="2"/><ellipse cx="46